<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="fire" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7a1a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7a1a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff7a1a" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ff7a1a" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Cyber Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Central Glow -->
  <circle cx="600" cy="270" r="320" fill="url(#glow)"/>

  <!-- Crosshair Accent -->
  <circle cx="600" cy="260" r="140" fill="none" stroke="#ff7a1a" stroke-width="2" stroke-dasharray="10 8" opacity="0.6"/>
  <circle cx="600" cy="260" r="40" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.8"/>
  <line x1="600" y1="90" x2="600" y2="150" stroke="#ff7a1a" stroke-width="3"/>
  <line x1="600" y1="370" x2="600" y2="430" stroke="#ff7a1a" stroke-width="3"/>
  <line x1="430" y1="260" x2="490" y2="260" stroke="#ff7a1a" stroke-width="3"/>
  <line x1="710" y1="260" x2="770" y2="260" stroke="#ff7a1a" stroke-width="3"/>

  <!-- Logo Banner -->
  <text x="600" y="280" text-anchor="middle" font-family="'Black Ops One', Impact, sans-serif" font-size="110" font-weight="900" fill="#ffffff" filter="url(#shadow)" letter-spacing="4">
    VOX<tspan fill="url(#fire)">FIRE</tspan><tspan fill="#64748b" font-size="52">.io</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="360" text-anchor="middle" font-family="'Chakra Petch', sans-serif" font-size="28" font-weight="700" fill="#94a3b8" letter-spacing="6">
    FREE 3D BLOCKY MULTIPLAYER BROWSER FPS
  </text>

  <!-- Feature Pills -->
  <g transform="translate(190, 440)" font-family="'Chakra Petch', sans-serif" font-size="18" font-weight="700">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="180" height="52" rx="26" fill="#1e293b" stroke="#ff7a1a" stroke-width="2"/>
    <text x="90" y="33" text-anchor="middle" fill="#ff7a1a">🌐 GLOBAL 4v4</text>

    <!-- Pill 2 -->
    <rect x="210" y="0" width="200" height="52" rx="26" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="310" y="33" text-anchor="middle" fill="#34d399">🔒 2-8 PLAYERS</text>

    <!-- Pill 3 -->
    <rect x="440" y="0" width="180" height="52" rx="26" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="530" y="33" text-anchor="middle" fill="#38bdf8">⚡ NO DOWNLOAD</text>

    <!-- Pill 4 -->
    <rect x="650" y="0" width="170" height="52" rx="26" fill="#1e293b" stroke="#eab308" stroke-width="2"/>
    <text x="735" y="33" text-anchor="middle" fill="#eab308">📱 120HZ TOUCH</text>
  </g>

  <!-- Footer Link -->
  <text x="600" y="580" text-anchor="middle" font-family="'Chakra Petch', sans-serif" font-size="22" font-weight="600" fill="#64748b" letter-spacing="3">
    PLAY NOW: PARSHVASHAH2008.GITHUB.IO/VOXFIRE-IO/
  </text>
</svg>
